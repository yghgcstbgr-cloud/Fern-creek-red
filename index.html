<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JCPS Soccer | League & Tournament Portal</title>
<style>
:root{--bg:#0b1220;--panel:#121e30;--panel2:#1b2a41;--line:#2b3c52;--text:#f4f7fb;--muted:#b5c4d8;--lime:#b6f36a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--lime);color:#15200d;font-weight:750}button.secondary{background:#26374d;color:var(--text);border:1px solid var(--line)}button.danger{background:#572b35;color:#fff;border:1px solid #8a4651}button.small{padding:6px 9px;font-size:13px}
header{padding:20px max(16px,calc((100% - 1100px)/2));background:#101c31;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.crest{display:grid;place-items:center;background:var(--lime);color:#13200a;width:48px;height:48px;border-radius:13px;font-size:25px}.brand h1{font-size:21px;margin:0}.brand p{margin:2px 0 0;color:var(--lime);font-size:11px;font-weight:800;letter-spacing:1.2px}
.wrap{max-width:1100px;margin:auto;padding:18px 16px 40px}.hero{background:linear-gradient(130deg,#1b2a41,#122034);padding:20px;border:1px solid var(--line);border-radius:18px;margin-bottom:16px}.hero small,.muted{color:var(--muted)}.hero h2{margin:5px 0 8px;font-size:clamp(23px,4vw,34px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.stat{background:#0f1a2b;padding:13px;border-radius:12px}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}nav button{background:#172338;color:var(--muted);border:1px solid var(--line)}nav button.active{background:var(--lime);color:#15200d;border-color:var(--lime)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.panel h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:block;color:var(--muted);font-size:13px;margin:0 0 5px}input,select{width:100%;padding:10px;background:#0c1727;color:var(--text);border:1px solid #34465d;border-radius:9px;min-width:0}.field{margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:540px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650}td.num,th.num{text-align:right}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#26374d;color:#dce8f8;font-size:11px}.match{background:#0f1a2b;border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0}.matchteams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.away{text-align:right}.score{font-size:18px;font-weight:850;color:var(--lime);white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.notice{background:#203a2b;color:#d6ffb5;border:1px solid #42643b;border-radius:10px;padding:10px;margin:10px 0}.warning{background:#3a2e1b;color:#ffe1a2;border:1px solid #72572b;border-radius:10px;padding:10px;margin:10px 0}.team-list{max-height:430px;overflow:auto}.teamrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.panel{padding:13px}.hero{padding:16px}header{padding:17px 16px}.matchteams{font-size:13px}}

/* Professional tournament-management portal styling inspired by modern soccer platforms */
:root{--bg:#f3f6fa;--panel:#ffffff;--panel2:#eef3f8;--line:#d7e0ea;--text:#172b4d;--muted:#60738a;--lime:#1266b1}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid #d7e0ea;box-shadow:0 2px 8px rgba(19,42,73,.04)}
.brand h1{color:#15365b;letter-spacing:.2px}.brand p{color:#1266b1;letter-spacing:1px}
.crest{background:#1266b1;color:#fff;border-radius:8px}
.wrap{max-width:1200px}
.hero{background:linear-gradient(115deg,#123c69,#176fb5);color:#fff;border:0;border-radius:12px;box-shadow:0 6px 18px rgba(18,60,105,.12)}
.hero small,.hero .muted{color:#dcecff}.hero h2{font-weight:750}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:8px}.stat span{color:#dcecff}.stat strong{color:#fff}
nav{gap:5px;border-bottom:1px solid var(--line);padding-bottom:12px}
nav button{background:transparent;color:#39536f;border:1px solid transparent;border-radius:7px;font-weight:650}
nav button.active{background:#e5f1fc;color:#075ba6;border-color:#b8d8f4}
nav button:hover{background:#edf5fc;color:#075ba6}
button{background:#1266b1;color:#fff;border-radius:7px;font-weight:650;box-shadow:none}
button:hover{filter:brightness(.96)}button.secondary{background:#fff;color:#254968;border:1px solid #c8d5e3}button.danger{background:#fff0f0;color:#a32626;border:1px solid #e8b9b9}
.panel{background:#fff;border:1px solid #dce4ed;border-radius:10px;box-shadow:0 2px 7px rgba(19,42,73,.035);padding:20px}
.panel h3{color:#183b61;font-size:17px}
input,select{background:#fff;color:#172b4d;border:1px solid #c7d4e2;border-radius:7px}
input:focus,select:focus{outline:2px solid #b9dcfb;border-color:#1266b1}
label{color:#50677f}
th{background:#f1f5f9;color:#526b84}th,td{border-bottom:1px solid #e1e8f0}tbody tr:hover{background:#f7fbff}
.match{background:#fff;border:1px solid #dce4ed;border-radius:9px}
.score{color:#1266b1}.pill{background:#e7f1fb;color:#17598f}
.empty{border-color:#cbd8e5;background:#fafcff;color:#60738a}
.notice{background:#e8f6ed;color:#17643a;border-color:#b9e3c8}.warning{background:#fff6df;color:#805b10;border-color:#efd58b}
.teamrow{border-bottom-color:#e7edf3}.muted{color:#60738a}
footer{color:#71839a}
@media(max-width:650px){.panel{padding:14px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}}

</style></head>
<body>
<header><div class="brand"><div class="crest">⚽</div><div><h1>JCPS SOCCER</h1><p>LEAGUES · FIXTURES · TOURNAMENTS</p></div></div></header>
<main class="wrap">
<section class="hero"><small>LEAGUE CENTRAL · 2026–27</small><h2 id="heroLeague">JCPS DIV 1 JV</h2><div class="muted">Fixtures · Rankings · Tournaments · Results</div><div class="stats"><div class="stat"><strong id="schoolCount">33</strong><span>Registered schools</span></div><div class="stat"><strong id="fixtureCount">0</strong><span>Fixtures</span></div><div class="stat"><strong id="leagueCount">1</strong><span>Leagues</span></div></div></section>
<nav id="nav"></nav><div id="notice" aria-live="polite"></div><section id="content"></section><footer>JCPS Soccer League & Tournament Portal</footer>
</main>
<script>
"use strict";
const SCHOOLS=["Jctms","Shawnee Academy","Carrithers","Crosby","Eco Trail","Farnsley","Highland","Hudson","Tomas Jefferson Academy","TJ Knight Middle","Kammer","Lassiter","Meyzeek","Moore Middle","Newburgh","Noee Middle","Olmsted Academy S","Olmsted Academy N","Ramsey","Stuart","Westport","Barret Traditional","Brown Middle","Web Dubois Academy","James Academy","Johnson Traditional","Western Middle School","B Bernheim Middle School","B Mt. Washington Middle School","B Hebron Middle School","B Eastside Middle School","B Zoneton Middle School","B Bullitt Lick Middle School"];
const MAIN="JCPS DIV 1 JV", KEY="jcpsSoccerLeague_v1", TABS=["Home","Leagues","Fixtures","Rankings","Overall Rankings","Teams","Tournaments","Admin"];
let activeTab="Home", selectedLeagueId="main", selectedTournamentId=null, state=loadState(), noticeTimer;
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function defaultState(){return {schools:SCHOOLS.slice(),leagues:[{id:"main",name:MAIN,isMain:true,levels:["A"],fixtures:[],tournaments:[]} ]}}
function normaliseState(x){
  const base=defaultState();
  if(!x||!Array.isArray(x.leagues)||!Array.isArray(x.schools))return base;
  const leagues=x.leagues.filter(v=>v&&typeof v==="object").map((v,i)=>({
    id:String(v.id||("league-"+i)),name:String(v.name||("League "+(i+1))),isMain:!!v.isMain||v.id==="main",
    levels:Array.isArray(v.levels)&&v.levels.length?v.levels.filter(z=>["A","B","C"].includes(z)): ["A"],
    fixtures:Array.isArray(v.fixtures)?v.fixtures.filter(m=>m&&typeof m==="object").map(m=>({...m,id:String(m.id||uid()),status:String(m.status||"Scheduled")})):[],
    tournaments:Array.isArray(v.tournaments)?v.tournaments.filter(t=>t&&typeof t==="object").map(t=>({...t,id:String(t.id||uid()),teams:Array.isArray(t.teams)?t.teams:[],groups:Array.isArray(t.groups)?t.groups:[],bracket:Array.isArray(t.bracket)?t.bracket:[],matches:Array.isArray(t.matches)?t.matches:[],generated:!!t.generated})):[]
  }));
  if(!leagues.length)leagues.push(...base.leagues);
  if(!leagues.some(v=>v.id==="main"))leagues.unshift({...base.leagues[0]});
  return {schools:base.schools,leagues};
}
function loadState(){try{return normaliseState(JSON.parse(localStorage.getItem(KEY)))}catch(e){return defaultState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));render()}catch(e){notify("Could not save in this browser. Export a backup from Admin.",true)}}
function league(){return state.leagues.find(l=>l.id===selectedLeagueId)||state.leagues[0]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function teams(l,all=false){return state.schools.flatMap(name=>(all?["A","B","C"]:(l.levels||["A"])).map(level=>({id:name+"::"+level,label:name+" "+level,name,level})))}
function teamOptions(l,selected="",all=false){return `<option value="">Select team</option>`+teams(l,all).map(t=>`<option value="${esc(t.id)}" ${t.id===selected?"selected":""}>${esc(t.label)}</option>`).join("")}
function notify(msg,warn=false){const el=document.getElementById("notice");el.innerHTML=`<div class="${warn?"warning":"notice"}">${esc(msg)}</div>`;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.innerHTML="",5000)}
function nav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-tab="${t}" class="${activeTab===t?"active":""}">${t}</button>`).join("")+`<button data-create-league="true">＋ Create League</button>`;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const tab=b.dataset.tab;if(tab==="Admin"){const entered=prompt("Enter admin password:");if(entered!=="1291"){if(entered!==null)notify("Incorrect admin password.",true);return}}activeTab=tab;render()});const create=document.querySelector("[data-create-league]");if(create)create.onclick=()=>{activeTab="Leagues";render();const form=document.getElementById("leagueForm");if(form){form.scrollIntoView({behavior:"smooth",block:"start"});form.querySelector('input[name="name"]').focus()}}}
function standings(l){const map=new Map(teams(l).map(t=>[t.id,{...t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));for(const m of l.fixtures){if(m.status!=="Final"||m.homeScore==null||m.awayScore==null)continue;const h=map.get(m.home),a=map.get(m.away);if(!h||!a)continue;h.p++;a.p++;h.gf+=+m.homeScore;h.ga+=+m.awayScore;a.gf+=+m.awayScore;a.ga+=+m.homeScore;if(+m.homeScore>+m.awayScore){h.w++;a.l++;h.pts+=3}else if(+m.homeScore<+m.awayScore){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}}return [...map.values()].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.label.localeCompare(b.label))}
function dateText(s){if(!s)return "Date not set";try{return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}catch(e){return s}}
function fixtureCard(m,l){const h=teams(l).find(t=>t.id===m.home),a=teams(l).find(t=>t.id===m.away);return `<div class="match"><div class="row"><span class="muted">${esc(dateText(m.date))} · ${esc(m.competition||l.name)}</span><span class="pill">${esc(m.status)}</span></div><div class="matchteams" style="margin:12px 0"><strong>${esc(h?.label||"Unknown team")}</strong><span class="score">${m.status==="Final"?`${m.homeScore} – ${m.awayScore}`:"VS"}</span><strong class="away">${esc(a?.label||"Unknown team")}</strong></div><div class="actions"><button class="small secondary" data-edit-match="${m.id}">Edit match</button><button class="small danger" data-delete-match="${m.id}">Delete</button></div></div>`}
function homeView(l){const upcoming=l.fixtures.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(0,4);return `<div class="panel"><h3>Welcome to ${esc(l.name)}</h3><p class="muted">Manage your school soccer league, match schedule, rankings and tournaments. The initial schedule starts empty so you can enter the official fixtures.</p><div class="actions"><button data-go="Fixtures">Manage fixtures</button><button class="secondary" data-go="Rankings">View rankings</button><button class="secondary" data-go="Tournaments">Tournaments</button></div></div><div class="panel"><h3>Upcoming fixtures</h3>${upcoming.length?upcoming.map(m=>fixtureCard(m,l)).join(""):'<div class="empty">No fixtures yet. Open Fixtures to create the schedule.</div>'}</div><div class="panel"><h3>League rules</h3><ul class="muted"><li>Each team plays every other team twice when you generate the double round-robin schedule.</li><li>Rankings calculate automatically from saved final scores: win = 3 points, draw = 1, loss = 0.</li><li>The school list is fixed. A, B and C are selectable team levels.</li></ul></div>`}
function fixturesView(l){return `<div class="panel"><h3>Create a fixture</h3><p class="muted">Choose both teams from the registered list. The same team cannot play itself.</p><form id="fixtureForm"><div class="grid"><div class="field"><label>Home team</label><select name="home" required>${teamOptions(l)}</select></div><div class="field"><label>Away team</label><select name="away" required>${teamOptions(l)}</select></div><div class="field"><label>Date</label><input type="date" name="date"></div><div class="field"><label>Competition / round label</label><input name="competition" placeholder="${esc(l.name)}"></div></div><button type="submit">Add fixture</button> <button type="button" class="secondary" id="generateSchedule">Generate double round-robin</button> <button type="button" class="secondary" id="generateTen">Generate 10 matches per team</button></form></div><div class="panel"><div class="row"><h3>Fixtures & results</h3><span class="pill">${l.fixtures.length} matches</span></div><div class="field"><label>Search fixtures by team, status or date</label><input id="fixtureSearch" placeholder="Search fixtures…"></div>${l.fixtures.length?l.fixtures.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(m=>fixtureCard(m,l)).join(""):'<div class="empty">No fixtures have been added yet.</div>'}</div>`}
function overallRankingsView(){const rows=state.leagues.flatMap(l=>standings(l).map(t=>({...t,leagueName:l.name,overallKey:l.id+"::"+t.id}))).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.label.localeCompare(b.label)||a.leagueName.localeCompare(b.leagueName));return `<div class="panel"><h3>Overall rankings — all leagues</h3><p class="muted">Combines every registered team from every league in one table. Teams are ordered by points, then goal difference, then goals scored. Since leagues may have different numbers of completed matches, compare played games as well as points.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>League</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.label)}</td><td>${esc(t.leagueName)}</td><td class="num">${t.p}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td><td class="num">${t.gf-t.ga}</td><td class="num"><strong>${t.pts}</strong></td></tr>`).join("")}</tbody></table></div></div>`}
function rankingsView(l){const rows=standings(l);return `<div class="panel"><h3>${esc(l.name)} rankings</h3><p class="muted">Updated automatically from fixtures marked Final. Teams with equal points are sorted by goal difference, then goals scored.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.label)}</td><td class="num">${t.p}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td><td class="num">${t.gf-t.ga}</td><td class="num"><strong>${t.pts}</strong></td></tr>`).join("")}</tbody></table></div></div>`}
function leagueDetailsView(l){const rows=standings(l);const past=l.fixtures.filter(m=>m.status==="Final"&&m.homeScore!=null&&m.awayScore!=null).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));return `<div class="panel"><div class="row"><div><h3>${esc(l.name)} — standings</h3><p class="muted">This league's table updates whenever a match is marked Final.</p></div><button class="secondary" data-go="Leagues">Back to leagues</button></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.label)}</td><td class="num">${t.p}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td><td class="num">${t.gf-t.ga}</td><td class="num"><strong>${t.pts}</strong></td></tr>`).join("")}</tbody></table></div></div><div class="panel"><h3>Past match scores</h3><p class="muted">Completed league and tournament matches are shown here when their fixtures are entered in this league and marked Final.</p>${past.length?past.map(m=>fixtureCard(m,l)).join(""):'<div class="empty">No completed match scores yet.</div>'}</div><div class="panel"><h3>All fixtures</h3>${l.fixtures.length?l.fixtures.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(m=>fixtureCard(m,l)).join(""):'<div class="empty">No fixtures have been added yet.</div>'}</div>`}
function teamsView(l){return `<div class="panel"><h3>Registered schools and team levels</h3><p class="muted">All 33 school names are locked. Each school can have A, B and C entries. Enable levels for this league below; it won't add new schools.</p><form id="levelsForm"><div class="actions">${["A","B","C"].map(x=>`<label style="display:flex;align-items:center;gap:6px;background:#0c1727;padding:10px;border-radius:9px"><input type="checkbox" name="level" value="${x}" ${(l.levels||["A"]).includes(x)?"checked":""}> ${x} teams</label>`).join("")}</div><p><button type="submit">Save league team levels</button></p></form><input id="schoolSearch" placeholder="Search schools…"><div class="team-list" id="schoolList">${state.schools.map((s,i)=>`<div class="teamrow" data-school="${esc(s.toLowerCase())}"><span>${i+1}. ${esc(s)}</span><span class="muted">${(l.levels||["A"]).map(x=>esc(x)).join(" / ")}</span></div>`).join("")}</div></div>`}
function tournamentsView(l){return `<div class="panel"><h3>Create tournament</h3><form id="tournamentForm"><div class="grid"><div class="field"><label>Tournament name</label><input name="name" required placeholder="e.g. JCPS Cup"></div><div class="field"><label>Format</label><select name="format"><option value="groups">Group stage + knockout</option><option value="knockout">Knockout only</option><option value="league">League format</option></select></div><div class="field"><label>Teams per group</label><select name="groupSize"><option>3</option><option selected>4</option><option>5</option></select></div><div class="field"><label>Teams advancing per group</label><select name="advance"><option value="1">Top 1</option><option value="2" selected>Top 2</option></select></div></div><p class="muted">Create the tournament, then tap Open tournament to generate its groups and knockout bracket.</p><button type="submit">Create tournament</button></form></div><div class="panel"><h3>Tournaments in ${esc(l.name)}</h3>${l.tournaments.length?l.tournaments.map(t=>`<div class="match"><div class="row"><strong>${esc(t.name)}</strong><span class="pill">${esc(t.formatLabel)}</span></div><p class="muted">${t.teams?.length||0} teams assigned ${t.generated?'· Bracket generated':''}</p><div class="actions"><button class="small" data-open-tournament="${t.id}">Open tournament</button><button class="small danger" data-delete-tournament="${t.id}">Delete tournament</button></div></div>`).join(""):'<div class="empty">No tournaments created yet.</div>'}</div>`}
function groupStandings(g){const rows=g.teams.map(id=>({id,label:teamLabel(id),p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(const m of g.matches||[]){if(m.status!=="Final"||m.homeScore==null||m.awayScore==null)continue;const h=rows.find(x=>x.id===m.home),a=rows.find(x=>x.id===m.away);if(!h||!a)continue;h.p++;a.p++;h.gf+=+m.homeScore;h.ga+=+m.awayScore;a.gf+=+m.awayScore;a.ga+=+m.homeScore;if(+m.homeScore>+m.awayScore){h.w++;a.l++;h.pts+=3}else if(+m.homeScore<+m.awayScore){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.label.localeCompare(b.label))}
function tournamentDetailView(l,t){if(!t)return tournamentsView(l);const all=teams(l,true),chosen=t.teams||[];let body="";if(t.generated&&t.format==="groups"){body=(t.groups||[]).map((g,i)=>{const rows=groupStandings(g);return `<div class="panel"><h3>Group ${String.fromCharCode(65+i)} standings</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((r,j)=>`<tr><td>${j+1}</td><td>${esc(r.label)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}</tbody></table></div><h4>Group fixtures</h4>${(g.matches||[]).map(m=>`<div class="match"><div class="matchteams"><strong>${esc(teamLabel(m.home))}</strong><span class="score">${m.status==="Final"?`${m.homeScore} – ${m.awayScore}`:"VS"}</span><strong class="away">${esc(teamLabel(m.away))}</strong></div><div class="actions"><span class="pill">${esc(m.status)}</span><button class="small secondary" data-edit-tmatch="${m.id}" data-group-index="${i}">Enter / edit score</button></div></div>`).join("")}</div>`}).join("");const done=t.groups.every(g=>g.matches.every(m=>m.status==="Final"&&m.homeScore!=null&&m.awayScore!=null));if(done){const q=[];t.groups.forEach((g,i)=>groupStandings(g).slice(0,Math.max(1,Number(t.advance)||2)).forEach((r,j)=>q.push({id:r.id,label:`${r.label} (Group ${String.fromCharCode(65+i)} #${j+1})`})));t.qualified=q;body+=`<div class="panel"><h3>Qualified teams</h3>${q.map((x,i)=>`<div class="teamrow"><span>${i+1}. ${esc(x.label)}</span><span class="pill">Qualified</span></div>`).join("")}<button id="buildKnockout">Generate knockout from qualifiers</button></div>`}else body+='<div class="panel"><p class="muted">Enter all group scores to calculate qualifiers, then generate the knockout bracket.</p></div>'}if(t.generated&&t.format==="knockout")body+=`<div class="panel"><h3>Knockout bracket</h3>${(t.bracket||[]).map(r=>`<div class="match"><strong>${esc(r.name)}</strong>${r.matches.map(m=>`<p>${esc(m.homeLabel)} <span class="score">vs</span> ${esc(m.awayLabel)}</p>`).join("")}</div>`).join("")}</div>`;if(t.generated&&t.format==="league")body+=`<div class="panel"><h3>League-format tournament fixtures</h3>${(t.matches||[]).map(m=>`<div class="match"><div class="matchteams"><strong>${esc(teamLabel(m.home))}</strong><span class="score">${m.status==="Final"?`${m.homeScore} – ${m.awayScore}`:"VS"}</span><strong class="away">${esc(teamLabel(m.away))}</strong></div><button class="small secondary" data-edit-tleague="${m.id}">Enter / edit score</button></div>`).join("")}</div>`;return `<div class="panel"><button class="secondary small" data-back-tournaments>← All tournaments</button><h3 style="margin-top:12px">${esc(t.name)}</h3><p class="muted">Choose teams, generate groups, enter scores, then advance qualifiers.</p><form id="tournamentTeamsForm"><div class="field"><label>Participating teams (select multiple)</label><select name="teams" multiple size="9" style="height:auto">${all.filter(x=>(l.levels||["A"]).includes(x.level)).map(x=>`<option value="${esc(x.id)}" ${chosen.includes(x.id)?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div><button type="submit">Save teams</button> <button type="button" id="generateTournament">${t.generated?"Regenerate tournament":"Generate groups / bracket"}</button></form></div>${body}`}
function render(){state=normaliseState(state);if(!state.leagues.length)state=defaultState();if(!state.leagues.some(l=>l.id===selectedLeagueId))selectedLeagueId=state.leagues[0].id;const l=league();document.getElementById("heroLeague").textContent=l.name;document.getElementById("schoolCount").textContent=state.schools.length;document.getElementById("fixtureCount").textContent=state.leagues.reduce((n,x)=>n+x.fixtures.length,0);document.getElementById("leagueCount").textContent=state.leagues.length;nav();const views={Home:homeView,Leagues:leaguesView,Fixtures:fixturesView,Rankings:rankingsView,"Overall Rankings":overallRankingsView,"League Details":leagueDetailsView,Teams:teamsView,Tournaments:tournamentsView,"Tournament Details":()=>tournamentDetailView(l,l.tournaments.find(t=>t.id===selectedTournamentId)),Admin:adminView};document.getElementById("content").innerHTML=views[activeTab](l);bind(l)}
function bind(l){
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.go;render()});
const ff=document.getElementById("fixtureForm");if(ff)ff.onsubmit=e=>{e.preventDefault();const f=new FormData(ff),home=f.get("home"),away=f.get("away");if(!home||!away)return notify("Choose both teams.",true);if(home===away)return notify("A team cannot play itself.",true);l.fixtures.push({id:uid(),home,away,date:f.get("date"),competition:(f.get("competition")||l.name).trim(),status:"Scheduled",homeScore:null,awayScore:null});save();notify("Fixture added.")};
const gen=document.getElementById("generateSchedule");if(gen)gen.onclick=()=>{const ts=teams(l);const expected=ts.length*(ts.length-1);if(!confirm(`Generate a double round-robin schedule for ${ts.length} teams? This adds ${expected} fixtures. Existing fixtures will be kept.`))return;const exists=new Set(l.fixtures.map(m=>[m.home,m.away].join("|")));let count=0;for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){for(const [h,a] of [[ts[i].id,ts[j].id],[ts[j].id,ts[i].id]]){const key=h+"|"+a;if(!exists.has(key)){l.fixtures.push({id:uid(),home:h,away:a,date:"",competition:l.name,status:"Scheduled",homeScore:null,awayScore:null});exists.add(key);count++}}}save();notify(`Added ${count} fixtures. Set dates and scores by editing each match.`)};
const gen10=document.getElementById("generateTen");if(gen10)gen10.onclick=()=>{const ts=teams(l);if(ts.length<11)return notify("At least 11 teams are needed for every team to play 10 different opponents.",true);if(!confirm(`Create a fresh 10-match schedule for all ${ts.length} teams? This replaces this league's existing fixtures, including scores. Export a backup first if needed.`))return;l.fixtures=[];const seen=new Set();let added=0;for(let offset=1;offset<=5;offset++){for(let i=0;i<ts.length;i++){const j=(i+offset)%ts.length;const key=[ts[i].id,ts[j].id].sort().join("||");if(seen.has(key))continue;seen.add(key);l.fixtures.push({id:uid(),home:ts[i].id,away:ts[j].id,date:"",competition:l.name+" · 10-game schedule",status:"Scheduled",homeScore:null,awayScore:null});added++}}save();notify(`Created ${added} fixtures. Every team has exactly 10 matches.`)};
document.querySelectorAll("[data-edit-match]").forEach(b=>b.onclick=()=>{const m=l.fixtures.find(x=>x.id===b.dataset.editMatch);if(!m)return;const h=teams(l).find(t=>t.id===m.home)?.label||"Home",a=teams(l).find(t=>t.id===m.away)?.label||"Away";const date=prompt("Match date (YYYY-MM-DD)",m.date||"");if(date===null)return;const status=prompt("Status: Scheduled, Live, Half-time, Postponed, or Final",m.status);if(status===null)return;let hs=m.homeScore,as=m.awayScore;if(status.toLowerCase()==="final"||status.toLowerCase()==="live"||status.toLowerCase()==="half-time"){hs=prompt(`${h} score`,hs??"0");if(hs===null)return;as=prompt(`${a} score`,as??"0");if(as===null)return;if(!/^\d+$/.test(hs)||!/^\d+$/.test(as))return notify("Scores must be whole numbers zero or greater.",true);hs=Number(hs);as=Number(as)}m.date=date;m.status=status.trim().replace(/\b\w/g,c=>c.toUpperCase());m.homeScore=hs===""?null:hs;m.awayScore=as===""?null:as;save();notify("Match updated; rankings recalculated.")});
document.querySelectorAll("[data-delete-match]").forEach(b=>b.onclick=()=>{if(confirm("Delete this fixture and its result?")){l.fixtures=l.fixtures.filter(m=>m.id!==b.dataset.deleteMatch);save();notify("Fixture deleted.")}});
const lf=document.getElementById("levelsForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const vals=[...lf.querySelectorAll('input[name="level"]:checked')].map(x=>x.value);if(!vals.length)return notify("Select at least one team level.",true);l.levels=vals;save();notify("Team levels saved. Fixtures using a removed level remain in the schedule but won't appear in rankings.")};
const search=document.getElementById("schoolSearch");if(search)search.oninput=()=>document.querySelectorAll("[data-school]").forEach(el=>el.style.display=el.dataset.school.includes(search.value.toLowerCase())?"flex":"none");
const tf=document.getElementById("tournamentForm");if(tf)tf.onsubmit=e=>{e.preventDefault();const f=new FormData(tf),format=f.get("format");l.tournaments.push({id:uid(),name:f.get("name").trim(),format,formatLabel:format==="groups"?"Group stage + knockout":format==="knockout"?"Knockout only":"League format",groupSize:Number(f.get("groupSize")),advance:Number(f.get("advance")),teams:[],generated:false,groups:[],bracket:[],matches:[]});save();notify("Tournament created. Open it to choose teams and generate the bracket.")};
document.querySelectorAll("[data-open-tournament]").forEach(b=>b.onclick=()=>{selectedTournamentId=b.dataset.openTournament;activeTab="Tournament Details";render()});const backT=document.querySelector("[data-back-tournaments]");if(backT)backT.onclick=()=>{activeTab="Tournaments";render()};const ttf=document.getElementById("tournamentTeamsForm");if(ttf)ttf.onsubmit=e=>{e.preventDefault();const sel=[...ttf.querySelector('select[name="teams"]').selectedOptions].map(o=>o.value);if(sel.length<2)return notify("Select at least two participating teams.",true);const t=l.tournaments.find(x=>x.id===selectedTournamentId);t.teams=sel;t.generated=false;save();notify(`${sel.length} teams saved to tournament.`)};const gt=document.getElementById("generateTournament");if(gt)gt.onclick=()=>{const t=l.tournaments.find(x=>x.id===selectedTournamentId);if(!t)return;const ids=t.teams||[];if(ids.length<2)return notify("Save at least two participating teams first.",true);if(!confirm(`Generate the ${t.formatLabel} for ${ids.length} teams? This replaces the current generated structure.`))return;t.groups=[];t.bracket=[];t.matches=[];if(t.format==="groups"){const size=t.groupSize||4;for(let i=0;i<ids.length;i+=size){const groupTeams=ids.slice(i,i+size),matches=[];for(let a=0;a<groupTeams.length;a++)for(let b=a+1;b<groupTeams.length;b++)matches.push({id:uid(),home:groupTeams[a],away:groupTeams[b],status:"Scheduled",homeScore:null,awayScore:null});t.groups.push({teams:groupTeams,matches})}const advanceCount=Math.max(1,Number(t.advance)||2);const qualifiers=t.groups.flatMap((g,i)=>Array.from({length:Math.min(advanceCount,g.teams.length)},(_,j)=>({homeLabel:`Group ${String.fromCharCode(65+i)} #${j+1}`,awayLabel:"TBD"})));makeBracket(t,qualifiers);}else if(t.format==="knockout"){makeBracket(t,ids.map(id=>({homeLabel:teamLabel(id),awayLabel:"TBD"})));}else{for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)t.matches.push({id:uid(),home:ids[a],away:ids[b],status:"Scheduled",homeScore:null,awayScore:null})}t.generated=true;save();notify("Tournament groups and bracket generated.")};
function teamLabel(id){return teams(l,true).find(x=>x.id===id)?.label||id}function makeBracket(t,entries){let current=entries.slice();let round=1;while(current.length>1){const matches=[];for(let i=0;i<current.length;i+=2){const a=current[i],b=current[i+1];matches.push({homeLabel:a?.homeLabel||teamLabel(a?.id||"TBD"),awayLabel:b?.homeLabel||teamLabel(b?.id||"TBD")})}t.bracket.push({name:round===1?"Knockout round "+round:"Knockout round "+round,matches});current=matches.map((m,i)=>({homeLabel:"Winner of "+m.homeLabel+" / "+m.awayLabel}));round++}}
document.querySelectorAll("[data-delete-tournament]").forEach(b=>b.onclick=()=>{if(confirm("Delete this tournament? League fixtures will not be deleted.")){l.tournaments=l.tournaments.filter(t=>t.id!==b.dataset.deleteTournament);save();notify("Tournament deleted.")}});
const fixtureSearch=document.getElementById("fixtureSearch");if(fixtureSearch)fixtureSearch.oninput=()=>{const q=fixtureSearch.value.toLowerCase();document.querySelectorAll("[data-edit-match]").forEach(b=>{const card=b.closest(".match");if(card)card.style.display=card.innerText.toLowerCase().includes(q)?"":"none"})};
document.querySelectorAll("[data-edit-tmatch]").forEach(b=>b.onclick=()=>{const t=l.tournaments.find(x=>x.id===selectedTournamentId),g=t?.groups?.[Number(b.dataset.groupIndex)],m=g?.matches?.find(x=>x.id===b.dataset.editTmatch);if(!m)return;const hs=prompt("Home score",m.homeScore??"0");if(hs===null)return;const as=prompt("Away score",m.awayScore??"0");if(as===null)return;if(!/^\d+$/.test(hs)||!/^\d+$/.test(as))return notify("Scores must be whole numbers.",true);m.homeScore=Number(hs);m.awayScore=Number(as);m.status="Final";save();notify("Group score saved; standings updated.")});
document.querySelectorAll("[data-edit-tleague]").forEach(b=>b.onclick=()=>{const t=l.tournaments.find(x=>x.id===selectedTournamentId),m=t?.matches?.find(x=>x.id===b.dataset.editTleague);if(!m)return;const hs=prompt("Home score",m.homeScore??"0");if(hs===null)return;const as=prompt("Away score",m.awayScore??"0");if(as===null)return;if(!/^\d+$/.test(hs)||!/^\d+$/.test(as))return notify("Scores must be whole numbers.",true);m.homeScore=Number(hs);m.awayScore=Number(as);m.status="Final";save();notify("Tournament score saved.")});
const buildKnockout=document.getElementById("buildKnockout");if(buildKnockout)buildKnockout.onclick=()=>{const t=l.tournaments.find(x=>x.id===selectedTournamentId);if(!t)return;const q=t.qualified||[];if(q.length<2)return notify("At least two teams must qualify.",true);t.bracket=[];makeBracket(t,q.map(x=>({homeLabel:x.label,awayLabel:"TBD"})));save();notify("Knockout bracket generated from group qualifiers.")};
const lform=document.getElementById("leagueForm");if(lform)lform.onsubmit=e=>{e.preventDefault();const f=new FormData(lform),name=f.get("name").trim();if(state.leagues.some(x=>x.name.toLowerCase()===name.toLowerCase()))return notify("A league with that name already exists.",true);const level=f.get("level");const levels=level==="ABC"?["A","B","C"]:[level];const n={id:uid(),name,isMain:false,levels,fixtures:[],tournaments:[]};state.leagues.push(n);selectedLeagueId=n.id;activeTab="Home";save();notify("League created.")};
document.querySelectorAll("[data-select-league]").forEach(b=>b.onclick=()=>{selectedLeagueId=b.dataset.selectLeague;activeTab="League Details";render()});
document.querySelectorAll("[data-delete-league]").forEach(b=>b.onclick=()=>{const x=state.leagues.find(x=>x.id===b.dataset.deleteLeague);if(x&&!x.isMain&&confirm(`Delete "${x.name}" and all its fixtures, results and tournaments? This cannot be undone unless you have a backup.`)){state.leagues=state.leagues.filter(y=>y.id!==x.id);if(selectedLeagueId===x.id)selectedLeagueId="main";save();notify("League deleted.")}});
const ex=document.getElementById("exportData");if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="jcps-soccer-backup.json";a.click();URL.revokeObjectURL(url)};
const im=document.getElementById("importData");if(im)im.onchange=async()=>{const file=im.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.schools)||!Array.isArray(parsed.leagues))throw Error();if(!confirm("Replace current browser data with this backup?"))return;state=parsed;selectedLeagueId=state.leagues[0]?.id||"main";save();notify("Backup imported.")}catch(e){notify("That backup file is invalid.",true)}};
const rl=document.getElementById("resetLeague");if(rl)rl.onclick=()=>{if(confirm(`Reset "${l.name}"? This clears its fixtures, results, and tournaments but keeps the league and registered schools.`)&&confirm("Are you absolutely sure? Export a backup first if you may need this data.")){l.fixtures=[];l.tournaments=[];save();notify("Current league reset.")}};
const ra=document.getElementById("resetAll");if(ra)ra.onclick=()=>{if(confirm("Reset the entire website? This deletes all extra leagues, fixtures, results and tournaments from this browser. The main league and school list will be restored.")&&confirm("Final confirmation: erase all website data in this browser?")){state=defaultState();selectedLeagueId="main";activeTab="Home";save();notify("Website data reset.")}};
}
window.addEventListener("error",function(){const el=document.getElementById("notice");if(el)el.innerHTML='<div class="warning">A website error occurred. Refresh the page. If it continues, send the developer this message.</div>';});
window.addEventListener("unhandledrejection",function(){const el=document.getElementById("notice");if(el)el.innerHTML='<div class="warning">A website action failed. Refresh the page and try again.</div>';});
render();
</script></body></html>
